name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run build && npm run check
      - name: Verify OIDC claims
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&audience=sts.amazonaws.com",
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          token = json.load(urllib.request.urlopen(request))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(json.dumps({key: claims[key] for key in ("iss", "aud", "sub")}, indent=2))
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy immutable assets
        run: |
          aws s3 sync dist/bryant/ s3://${{ vars.BRYANT_S3_BUCKET }}/ --exclude "*" --include "assets/*" --include "styles.*.css" --delete --cache-control "public,max-age=31536000,immutable"
      - name: Deploy documents
        run: |
          aws s3 sync dist/bryant/ s3://${{ vars.BRYANT_S3_BUCKET }}/ --exclude "assets/*" --exclude "styles.*.css" --delete --cache-control "public,max-age=300,must-revalidate"
