name: Build and deploy portfolios
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build && npm run check
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy immutable assets
        run: |
          aws s3 sync dist/bri/ s3://${{ vars.BRI_S3_BUCKET }}/ --exclude "*" --include "assets/*" --include "styles.*.css" --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/bryant/ s3://${{ vars.BRYANT_S3_BUCKET }}/ --exclude "*" --include "assets/*" --include "styles.*.css" --delete --cache-control "public,max-age=31536000,immutable"
      - name: Deploy documents
        run: |
          aws s3 sync dist/bri/ s3://${{ vars.BRI_S3_BUCKET }}/ --exclude "assets/*" --exclude "styles.*.css" --delete --cache-control "public,max-age=300,must-revalidate"
          aws s3 sync dist/bryant/ s3://${{ vars.BRYANT_S3_BUCKET }}/ --exclude "assets/*" --exclude "styles.*.css" --delete --cache-control "public,max-age=300,must-revalidate"
      - name: Invalidate CloudFront
        if: ${{ vars.BRI_CLOUDFRONT_DISTRIBUTION_ID != '' && vars.BRYANT_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ vars.BRI_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
          aws cloudfront create-invalidation --distribution-id "${{ vars.BRYANT_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
